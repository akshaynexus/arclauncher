name: flauncher
description: Flutter-based Android TV launcher.

version: 1.0.4+4106

environment:
  sdk: ">=3.4.3"
  flutter: ">=3.24.5"

dependencies:
  flutter:
    sdk: flutter

  intl: any
  drift: ^2.33.0
  path: ^1.9.0
  path_provider: ^2.0.13
  package_info_plus: ^10.1.0
  provider: ^6.0.5
  shared_preferences: ^2.3.3
  google_fonts: ^8.1.0
  screen_brightness: ^2.1.9
  sqlite3_flutter_libs: ^0.6.0+eol
  flutter_localizations:
    sdk: flutter
  media_kit:
    git:
      url: https://github.com/akshaynexus/media-kit.git
      ref: expose-set-property
      path: media_kit
  media_kit_video:
    git:
      url: https://github.com/akshaynexus/media-kit.git
      ref: expose-set-property
      path: media_kit_video
  media_kit_libs_video: ^1.0.5
  aerial_views:
    path: ../AerialViewsFlutter
  easy_localization: ^3.0.8
  flutter_displaymode: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.3.3
  flutter_lints: ^6.0.0
  mockito: ^5.3.2
  drift_dev: ^2.33.0
  network_image_mock: ^2.1.1
  transparent_image: ^2.0.1

  shared_preferences_platform_interface: any
  path_provider_platform_interface: any
  plugin_platform_interface: any
  package_info_plus_platform_interface: any
  flutter_launcher_icons: ^0.14.4
  drift_local_storage_inspector: ^0.8.0

flutter_icons:
  android: "ic_launcher"
  ios: false
  min_sdk_android: 21
  image_path: "assets/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon.png"
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/translations/
