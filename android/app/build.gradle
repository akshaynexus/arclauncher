plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def secretProperties = new Properties()
secretProperties.setProperty("signing_keystore_password", "${System.getenv('FLAUNCHER_KEYSTORE_PASSWORD')}")
secretProperties.setProperty("signing_key_password", "${System.getenv('FLAUNCHER_SIGNING_KEY_PASSWORD')}")
secretProperties.setProperty("signing_key_alias", "${System.getenv('FLAUNCHER_SIGNING_KEY_ALIAS')}")

android {
    flavorDimensions += "store"

    productFlavors {
        play {
            dimension "store"
        }
        github {
            dimension "store"
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs (for IzzyOnDroid/F-Droid)
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles (for Google Play)
        includeInBundle = false
    }

    defaultConfig {
        applicationId "com.hseuniversal.tidytv"
        compileSdk 36
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        ndk {
            abiFilters.clear()
            abiFilters.addAll(["arm64-v8a", "armeabi-v7a", "x86_64"])
        }
    }

    signingConfigs {
        debug {}
        release {
            if (localProperties['storeFile'] != null) {
                storeFile file(localProperties['storeFile'])
                storePassword localProperties['storePassword']
                keyAlias localProperties['keyAlias']
                keyPassword localProperties['keyPassword']
            } else if (file('upload-keystore.jks').exists()) {
                def storePass = System.getenv('SIGNING_KEYSTORE_PASSWORD')
                def alias = System.getenv('SIGNING_KEY_ALIAS')
                def keyPass = System.getenv('SIGNING_KEY_PASSWORD')
                if (storePass == null || alias == null || keyPass == null) {
                    throw new Exception(
                            'upload-keystore.jks is present but SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, and SIGNING_KEY_PASSWORD must be set')
                }
                storeFile file('upload-keystore.jks')
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    splits {
        abi {
            // https://stackoverflow.com/a/39950584/21037183
            enable gradle.startParameter.taskNames.any {
                it.startsWith("assemble") && it.endsWith("Release")
            }
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'com.hseuniversal.tidytv'

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                outputFileName = "arc-launcher-${abi}-${variant.buildType.name}.apk"
            } else {
                outputFileName = "arc-launcher-universal-${variant.buildType.name}.apk"
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-datasource:1.5.1"
}
